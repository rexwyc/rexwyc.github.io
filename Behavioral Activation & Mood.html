<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT & Depression Simulator (Randomized Choices)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --mood-color: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.2rem;
            text-align: center;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-muted);
        }

        .status-panel {
            background: #f1f5f9;
            padding: 0.85rem;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            border: 1px solid var(--border);
        }

        .stats-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .meter-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .meter-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            width: 50%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .scenario-box {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.5;
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 0.75rem;
            min-height: 80px;
            display: flex;
            align-items: center;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        button.choice-btn {
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 0.75rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            line-height: 1.4;
        }

        button.choice-btn:hover {
            background: #f1f5f9;
            border-color: var(--primary);
        }

        .explanation-box {
            background: #e0e7ff;
            color: #3730a3;
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            line-height: 1.5;
            display: none;
        }

        button.action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 0.75rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            display: none;
        }

        button.action-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CBT & Depression Simulator</h1>
        <p>Behavioral Activation, Mood Tracking & Randomized Choices</p>
    </header>

    <div class="status-panel">
        <div class="stats-top">
            <span id="progress-text">Scenario 1 / 50</span>
            <span id="score-text">Resilience: 0</span>
        </div>
        <div class="meter-group">
            <span>Energy Reserve: <span id="energy-val">50</span>%</span>
            <div class="meter-bar"><div class="meter-fill" id="energy-fill" style="width: 50%;"></div></div>
        </div>
        <div class="meter-group">
            <span>Mood / Activation Level: <span id="mood-val">40</span>%</span>
            <div class="meter-bar"><div class="meter-fill" id="mood-fill" style="width: 40%; background: var(--mood-color);"></div></div>
        </div>
    </div>

    <div class="scenario-box" id="scenario-text">Loading scenario...</div>

    <div class="choices-container" id="choices-container"></div>

    <div class="explanation-box" id="explanation-box"></div>

    <button class="action-btn" id="next-btn" onclick="nextScenario()">Next Scenario</button>
</div>

<script>
    // Web Audio API Synthesizer
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        initAudio();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'warning') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
            osc.frequency.setValueAtTime(185, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }
    }

    // State variables
    let energy = 50;
    let mood = 40;
    let score = 0;
    let currentIndex = 0;

    // 10 Core Structured Scenarios (Loops infinitely through 50 steps)
    const scenarios = [
        {
            s: "You wake up feeling heavy inertia and fatigue. The thought says: 'Today is going to be terrible, why bother getting up?'",

            c2: { text: "Acknowledge the heavy feeling, but sit up on the edge of the bed and drink water.", score: 15, energyDelta: 10, moodDelta: 15, type: 'success', exp: "Step 1: Behavioral Activation principle. Step 2: Micro-actions bypass executive paralysis without needing high initial energy." }
        },
        {
            s: "You look at your messy room and feel overwhelmed, thinking: 'It's too dirty, I'll never clean it all.'",

            c2: { text: "Pick up just 3 items and put them away as a micro-goal.", score: 10, energyDelta: 5, moodDelta: 12, type: 'success', exp: "Step 1: Chunking tasks breaks down cognitive overload. Step 2: Small momentum builds self-efficacy." }
        },
        {

            c2: { text: "Go for 20 minutes; allow yourself to leave early if needed.", score: 20, energyDelta: 10, moodDelta: 20, type: 'success', exp: "Step 1: Behavioral experiment. Step 2: Testing assumptions against reality rather than accepting thoughts as facts." }
        },
        {
            s: "You make a minor mistake on a work or school task and think: 'I am completely incompetent at everything.'",
            c1: { text: "Spiral into self-criticism and give up on the rest of the project.", score: -15, energyDelta: -10, moodDelta: -15, type: 'warning', exp: "Step 1: All-or-nothing thinking. Step 2: Labeling errors as total identity failure." },
            c2: { text: "Separate the specific mistake from your overall capability and correct it.", score: 15, energyDelta: 5, moodDelta: 15, type: 'success', exp: "Step 1: Cognitive reframing. Step 2: Recognizing that mistakes are isolated events, not global traits." }
        },
        {
            s: "Your evening is approaching and you haven't accomplished much. You feel deep guilt.",
            c1: { text: "Spend hours scrolling social media to numb the negative emotions.", score: -10, energyDelta: -15, moodDelta: -10, type: 'warning', exp: "Step 1: Numbing behaviors prevent processing emotions and drain mental energy." },
            c2: { text: "List even the smallest thing you did today (like eating or breathing) as a valid win.", score: 15, energyDelta: 8, moodDelta: 18, type: 'success', exp: "Step 1: Self-compassion. Step 2: Redefining productivity during low-energy periods." }
        },
        {
            s: "You feel sudden anxiety about an upcoming task next week and your mind starts catastrophizing.",
            c1: { text: "Worry continuously and replay worst-case scenarios in your head.", score: -10, energyDelta: -10, moodDelta: -10, type: 'warning', exp: "Step 1: Rumination loops amplify perceived threat levels." },
            c2: { text: "Write down the specific fear and identify one single controllable step you can take now.", score: 20, energyDelta: 10, moodDelta: 20, type: 'success', exp: "Step 1: Externalizing anxiety. Step 2: Shifting from passive worry to active problem-solving." }

            c2: { text: "Step outside onto the porch or near an open window for 5 minutes.", score: 15, energyDelta: 12, moodDelta: 18, type: 'success', exp: "Step 1: Environmental shift. Step 2: Natural light and gentle sensory changes stimulate neurochemical balance." }
        },
        {
            s: "You compare your current slow pace to someone else's high productivity.",
            c1: { text: "Conclude that you are lazy and broken compared to them.", score: -15, energyDelta: -5, moodDelta: -15, type: 'warning', exp: "Step 1: Unfair upward comparison ignoring individual baselines and energy reserves." },
            c2: { text: "Remind yourself that healing and recovery require different pacing than peak output.", score: 15, energyDelta: 5, moodDelta: 15, type: 'success', exp: "Step 1: Validating personal context. Step 2: Releasing unrealistic self-expectations." }

        {

            c2: { text: "Set a timer for 10 minutes and commit to working on just the outline, then stop if needed.", score: 18, energyDelta: 8, moodDelta: 16, type: 'success', exp: "Step 1: The 10-minute rule lowers activation energy. Step 2: Permission to stop removes pressure." }

        },
        {
            s: "Your inner critic tells you that you are a burden to everyone around you.",

        {

        {

            c1: { text: "Ignore your body and push through your current activity.", score: -5, energyDelta: -5, moodDelta: -5, type: 'warning', exp: "Step 1: Disconnecting from somatic cues maintains chronic stress cycles." },
            c2: { text: "Take 3 deep, slow belly breaths and consciously drop your shoulders.", score: 12, energyDelta: 10, moodDelta: 14, type: 'success', exp: "Step 1: Somatic regulation. Step 2: Activating the parasympathetic nervous system via breath." }
        },
        {

            c1: { text: "Snap back at them or dismiss their feedback entirely to protect your ego.", score: -12, energyDelta: -8, moodDelta: -10, type: 'warning', exp: "Step 1: Ego-defense blocks personal growth. Step 2: Damages interpersonal trust." },

        {

        },
        {

        },
        {

            c1: { text: "Keep ignoring nutrition because cooking feels like an impossible mountain.", score: -8, energyDelta: -12, moodDelta: -8, type: 'warning', exp: "Step 1: Poor physical fuel directly impacts mood stability and cognitive function." },
            c2: { text: "Eat the easiest possible nourishing option (like toast with peanut butter) and drink a full glass of water.", score: 15, energyDelta: 12, moodDelta: 14, type: 'success', exp: "Step 1: Prioritizing baseline physiological needs. Step 2: Self-care without perfectionism." }

        },
        {

    function updateMeters() {
        energy = Math.max(0, Math.min(100, energy));
        mood = Math.max(0, Math.min(100, mood));

        document.getElementById('energy-val').innerText = energy;
        document.getElementById('energy-fill').style.width = energy + '%';

        document.getElementById('mood-val').innerText = mood;
        document.getElementById('mood-fill').style.width = mood + '%';

        document.getElementById('score-text').innerText = `Resilience: ${score}`;
    }

    function loadScenario() {
        const item = scenarios[currentIndex % scenarios.length];
        const displayNum = (currentIndex % 50) + 1;
        
        document.getElementById('progress-text').innerText = `Scenario ${displayNum} / 50 (Infinite Loop)`;
        document.getElementById('scenario-text').innerText = item.s;

        // Randomize the order of choices so the positive/negative choices swap positions randomly
        let currentChoices = [item.c1, item.c2];
        if (Math.random() < 0.5) {
            currentChoices = [item.c2, item.c1];
        }

        const container = document.getElementById('choices-container');
        container.innerHTML = '';
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        currentChoices.forEach((choice, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${choice.text}`;
            btn.onclick = () => selectChoice(choice);
            container.appendChild(btn);
        });
        updateMeters();
    }

    function selectChoice(choice) {
        playSound(choice.type);
        score += choice.score;
        energy += choice.energyDelta;
        mood += choice.moodDelta;
        updateMeters();

        const container = document.getElementById('choices-container');
        container.innerHTML = ''; // Hide choices

        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'block';
        expBox.innerHTML = `<b>Step-by-Step Psychological Rationale:</b><br>${choice.exp}`;

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextScenario() {
        currentIndex++;
        loadScenario();
    }

    window.onload = loadScenario;
</script>
