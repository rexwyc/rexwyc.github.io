<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Pong</title>
    <style>
        body {
            background-color: #0b0b16;
            color: #00ffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-title {
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        #subtitle {
            color: #ff00ff;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #ff00ff;
        }

        #controls {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background: #111;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transition: 0.2s;
        }

        button:hover {
            background: #00ffff;
            color: #0b0b16;
            box-shadow: 0 0 20px #00ffff;
        }

        #gameCanvas {
            border: 4px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(0, 255, 255, 0.2);
            background-color: #020208;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <h1 id="game-title">Neon Cyber Pong</h1>
    <p id="subtitle">Created by Allan Alcorn (1972) • Upgraded with Arcade Juice & Synthwave</p>

    <div id="controls">
        <p style="margin:0; color: #888;">Move mouse to control paddle.</p>
        <button id="musicBtn">🎵 Music: ON</button>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const context = canvas.getContext('2d');
        const musicBtn = document.getElementById('musicBtn');

        // Game States
        let gameState = 'START'; 
        let winnerText = "";

        // Web Audio API setup
        let audioCtx = null;
        let isMusicPlaying = true; 
        let nextNoteTime = 0;
        let currentNote = 0;
        let musicTimerID;

        // Synthwave Bassline
        const bassline = [
            110.00, 110.00, 130.81, 110.00, 
            146.83, 110.00, 130.81, 123.47  
        ];
        const tempo = 150; 
        const lookahead = 25.0; 
        const scheduleAheadTime = 0.1; 

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function nextNote() {
            const secondsPerBeat = 60.0 / tempo;
            nextNoteTime += secondsPerBeat * 0.25; 
            currentNote = (currentNote + 1) % bassline.length;
        }

        function playMusicNote(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.value = bassline[currentNote];
            
            gain.gain.setValueAtTime(0.04, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(time);
            osc.stop(time + 0.12);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                if (isMusicPlaying) playMusicNote(nextNoteTime);
                nextNote();
            }
            musicTimerID = setTimeout(scheduler, lookahead);
        }

        function startMusic() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            nextNoteTime = audioCtx.currentTime + 0.05;
            scheduler();
        }

        function toggleMusic() {
            isMusicPlaying = !isMusicPlaying;
            musicBtn.innerText = isMusicPlaying ? "🎵 Music: ON" : "🎵 Music: OFF";
            musicBtn.style.color = isMusicPlaying ? "#00ffff" : "#ff0055";
            musicBtn.style.borderColor = isMusicPlaying ? "#00ffff" : "#ff0055";
        }

        // Particle System for Explosions
        let particles = [];
        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    context.save();
                    context.globalAlpha = p.alpha;
                    context.fillStyle = p.color;
                    context.shadowBlur = 10;
                    context.shadowColor = p.color;
                    context.beginPath();
                    context.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    context.fill();
                    context.restore();
                }
            }
        }

        // Sound Effects
        function playSound(type, extraParam = 0) {
            if (!audioCtx || !isMusicPlaying) return;
            const time = audioCtx.currentTime + 0.01;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                const baseFreq = 523.25; // C5
                const speedBonus = (extraParam - 7) * 45; 
                osc.type = 'square';
                osc.frequency.setValueAtTime(Math.min(baseFreq + speedBonus, 1200), time);
                gain.gain.setValueAtTime(0.08, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
                osc.start(time);
                osc.stop(time + 0.08);
            } else if (type === 'wall') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(261.63, time); // C4
                gain.gain.setValueAtTime(0.08, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
                osc.start(time);
                osc.stop(time + 0.08);
            } else if (type === 'score') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, time);
                osc.frequency.exponentialRampToValueAtTime(100, time + 0.3);
                gain.gain.setValueAtTime(0.12, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
                osc.start(time);
                osc.stop(time + 0.3);
            }
        }

        // Game objects
        const ball = { x: 400, y: 300, radius: 10, velocityX: 6, velocityY: 6, speed: 7.5, color: '#ffffff' };
        const user = { x: 15, y: 250, width: 12, height: 100, score: 0, color: '#00ffff' };
        const com = { x: 773, y: 250, width: 12, height: 100, score: 0, color: '#ff00ff' };
        const net = { x: 399, y: 0, height: 15, width: 2, color: '#222244' };

        musicBtn.addEventListener("click", toggleMusic);

        canvas.addEventListener("mousemove", (event) => {
            let rect = canvas.getBoundingClientRect();
            user.y = event.clientY - rect.top - user.height / 2;
        });

        canvas.addEventListener("click", () => {
            initAudio(); 
            if (gameState === 'START') {
                gameState = 'PLAYING';
                startMusic(); 
            } else if (gameState === 'GAMEOVER') {
                user.score = 0;
                com.score = 0;
                gameState = 'PLAYING';
                resetBall();
            }
        });

        function drawRect(x, y, w, h, color) {
            context.fillStyle = color;
            context.fillRect(x, y, w, h);
        }

        function drawGlowingBall(x, y, r, color) {
            context.save();
            context.shadowBlur = 20;
            context.shadowColor = color;
            context.fillStyle = color;
            context.beginPath();
            context.arc(x, y, r, 0, Math.PI * 2, true);
            context.closePath();
            context.fill();
            context.restore();
        }

        function drawGlowingRect(x, y, w, h, color) {
            context.save();
            context.shadowBlur = 15;
            context.shadowColor = color;
            context.fillStyle = color;
            context.fillRect(x, y, w, h);
            context.restore();
        }

        function drawText(text, x, y, font = "75px 'Courier New'", color = "#fff") {
            context.save();
            context.shadowBlur = 10;
            context.shadowColor = color;
            context.fillStyle = color;
            context.font = font;
            context.fillText(text, x, y);
            context.restore();
        }

        function drawNet() {
            for (let i = 0; i <= canvas.height; i += 25) {
                drawRect(net.x, net.y + i, net.width, net.height, net.color);
            }
        }

        function collision(b, p) {
            p.top = p.y;
            p.bottom = p.y + p.height;
            p.left = p.x;
            p.right = p.x + p.width;

            b.top = b.y - b.radius;
            b.bottom = b.y + b.radius;
            b.left = b.x - b.radius;
            b.right = b.x + b.radius;

            return p.left < b.right && p.top < b.bottom && p.right > b.left && p.bottom > b.top;
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = -ball.velocityX;
            ball.speed = 7.5;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Smooth AI tracking with slight reaction lag
            com.y += ((ball.y - (com.y + com.height / 2))) * 0.09;

            // Wall collisions (Top/Bottom)
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
                playSound('wall');
                createParticles(ball.x, ball.y, '#ffffff');
            }

            let player = (ball.x + ball.radius < canvas.width / 2) ? user : com;

            // Paddle collisions
            if (collision(ball, player)) {
                playSound('hit', ball.speed);
                createParticles(ball.x, ball.y, player.color);

                let collidePoint = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.x + ball.radius < canvas.width / 2) ? 1 : -1;

                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                ball.speed += 0.35; // Progressive speed boost
            }

            // Scoring logic
            if (ball.x - ball.radius < 0) {
                com.score++;
                playSound('score');
                createParticles(0, ball.y, '#ff00ff');
                if (com.score >= 5) {
                    gameState = 'GAMEOVER';
                    winnerText = "CPU WINS";
                } else resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                user.score++;
                playSound('score');
                createParticles(canvas.width, ball.y, '#00ffff');
                if (user.score >= 5) {
                    gameState = 'GAMEOVER';
                    winnerText = "YOU WIN!";
                } else resetBall();
            }
        }

        function draw() {
            drawRect(0, 0, canvas.width, canvas.height, '#020208');
            
            if (gameState === 'START') {
                drawText("NEON PONG", canvas.width / 2 - 200, canvas.height / 2 - 40, "65px 'Courier New'", "#00ffff");
                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    drawText("CLICK TO START GAME", canvas.width / 2 - 170, canvas.height / 2 + 30, "22px 'Courier New'", "#ff00ff");
                }
                return; 
            }

            drawNet();
            drawText(user.score, canvas.width / 4, canvas.height / 5, "75px 'Courier New'", "#00ffff");
            drawText(com.score, 3 * canvas.width / 4, canvas.height / 5, "75px 'Courier New'", "#ff00ff");
            
            drawGlowingRect(user.x, user.y, user.width, user.height, user.color);
            drawGlowingRect(com.x, com.y, com.width, com.height, com.color);
            
            updateAndDrawParticles();
            drawGlowingBall(ball.x, ball.y, ball.radius, ball.color);

            if (gameState === 'GAMEOVER') {
                context.fillStyle = "rgba(2, 2, 8, 0.85)";
                context.fillRect(0, 0, canvas.width, canvas.height);
                drawText(winnerText, canvas.width / 2 - 150, canvas.height / 2, "60px 'Courier New'", winnerText.includes("WIN") ? "#00ffff" : "#ff00ff");
                drawText("CLICK TO PLAY AGAIN", canvas.width / 2 - 130, canvas.height / 2 + 50, "22px 'Courier New'", "#ffffff");
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
