<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Pong with Auto-Playing Music!</title>
    <style>
        body {
            background-color: #222;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-title {
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #controls {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background: #444;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
        }

        button:hover {
            background: #0f0;
            color: #111;
        }

        #gameCanvas {
            border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            background-color: #000;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <h1 id="game-title">Arcade Pong</h1>
    <div id="controls">
        <p style="margin:0; color: #aaa;">Move mouse to control your paddle.</p>
        <button id="musicBtn">🎵 Music: ON</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const context = canvas.getContext('2d');
        const musicBtn = document.getElementById('musicBtn');

        // Game States
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let winnerText = "";

        // Web Audio API setup
        let audioCtx = null;
        let isMusicPlaying = true; // Set to true by default now
        let nextNoteTime = 0;
        let currentNote = 0;
        let musicTimerID;

        // Fast-paced arcade bassline (Frequencies in Hz)
        const bassline = [
            110.00, 110.00, 130.81, 110.00, // A2, A2, C3, A2
            146.83, 110.00, 130.81, 123.47  // D3, A2, C3, B2
        ];
        const tempo = 140; // Beats per minute
        const lookahead = 25.0; // How frequently to call scheduling function (in ms)
        const scheduleAheadTime = 0.1; // How far ahead to schedule audio (sec)

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- BACKGROUND MUSIC SCHEDULER ---
        // This scheduling method guarantees the music won't stutter
        function nextNote() {
            const secondsPerBeat = 60.0 / tempo;
            nextNoteTime += secondsPerBeat * 0.25; // 16th notes
            currentNote = (currentNote + 1) % bassline.length;
        }

        function playMusicNote(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.value = bassline[currentNote];
            
            // Envelope for a "plucky" synth sound
            gain.gain.setValueAtTime(0.05, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(time);
            osc.stop(time + 0.1);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                if (isMusicPlaying) {
                    playMusicNote(nextNoteTime);
                }
                nextNote();
            }
            musicTimerID = setTimeout(scheduler, lookahead);
        }

        function startMusic() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            nextNoteTime = audioCtx.currentTime + 0.05;
            scheduler();
        }

        function toggleMusic() {
            isMusicPlaying = !isMusicPlaying;
            musicBtn.innerText = isMusicPlaying ? "🎵 Music: ON" : "🎵 Music: OFF";
            musicBtn.style.color = isMusicPlaying ? "#0f0" : "#ff0000";
            musicBtn.style.borderColor = isMusicPlaying ? "#0f0" : "#ff0000";
        }

        // --- SOUND EFFECTS ---
        function playSound(type, extraParam = 0) {
            if (!audioCtx || !isMusicPlaying) return;
            const time = audioCtx.currentTime + 0.01;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                const baseFreq = 440;
                const speedBonus = (extraParam - 7) * 40; 
                osc.type = 'square';
                osc.frequency.setValueAtTime(Math.min(baseFreq + speedBonus, 1000), time);
                gain.gain.setValueAtTime(0.1, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                osc.start(time);
                osc.stop(time + 0.1);

            } else if (type === 'wall') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, time);
                gain.gain.setValueAtTime(0.1, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                osc.start(time);
                osc.stop(time + 0.1);

            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, time);
                osc.frequency.exponentialRampToValueAtTime(100, time + 0.4);
                gain.gain.setValueAtTime(0.2, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
                osc.start(time);
                osc.stop(time + 0.4);
            }
        }

        // Game objects
        const ball = { x: 400, y: 300, radius: 10, velocityX: 5, velocityY: 5, speed: 7, color: '#fff' };
        const user = { x: 0, y: 250, width: 10, height: 100, score: 0, color: '#0f0' };
        const com = { x: 790, y: 250, width: 10, height: 100, score: 0, color: '#ff0000' };
        const net = { x: 399, y: 0, height: 10, width: 2, color: '#444' };

        // Event Listeners
        musicBtn.addEventListener("click", toggleMusic);

        canvas.addEventListener("mousemove", (event) => {
            let rect = canvas.getBoundingClientRect();
            user.y = event.clientY - rect.top - user.height / 2;
        });

        canvas.addEventListener("click", () => {
            initAudio(); // Safely unlock audio on direct canvas click
            
            if (gameState === 'START') {
                gameState = 'PLAYING';
                startMusic(); // Start background music on first click!
            } else if (gameState === 'GAMEOVER') {
                user.score = 0;
                com.score = 0;
                gameState = 'PLAYING';
                resetBall();
            }
        });

        // Drawing Functions
        function drawRect(x, y, w, h, color) {
            context.fillStyle = color;
            context.fillRect(x, y, w, h);
        }

        function drawBall(x, y, r, color) {
            context.fillStyle = color;
            context.beginPath();
            context.arc(x, y, r, 0, Math.PI * 2, true);
            context.closePath();
            context.fill();
        }

        function drawText(text, x, y, font = "75px 'Courier New'") {
            context.fillStyle = '#fff';
            context.font = font;
            context.fillText(text, x, y);
        }

        function drawNet() {
            for (let i = 0; i <= canvas.height; i += 20) {
                drawRect(net.x, net.y + i, net.width, net.height, net.color);
            }
        }

        function collision(b, p) {
            p.top = p.y;
            p.bottom = p.y + p.height;
            p.left = p.x;
            p.right = p.x + p.width;

            b.top = b.y - b.radius;
            b.bottom = b.y + b.radius;
            b.left = b.x - b.radius;
            b.right = b.x + b.radius;

            return p.left < b.right && p.top < b.bottom && p.right > b.left && p.bottom > b.top;
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = -ball.velocityX;
            ball.speed = 7;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Computer AI
            com.y += ((ball.y - (com.y + com.height / 2))) * 0.08;

            // Wall collisions
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
                playSound('wall');
            }

            let player = (ball.x + ball.radius < canvas.width / 2) ? user : com;

            if (collision(ball, player)) {
                playSound('hit', ball.speed);
                let collidePoint = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.x + ball.radius < canvas.width / 2) ? 1 : -1;

                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                ball.speed += 0.3; // Speed up
            }

            // Scoring
            if (ball.x - ball.radius < 0) {
                com.score++;
                playSound('score');
                if (com.score >= 5) {
                    gameState = 'GAMEOVER';
                    winnerText = "CPU WINS";
                } else resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                user.score++;
                playSound('score');
                if (user.score >= 5) {
                    gameState = 'GAMEOVER';
                    winnerText = "YOU WIN!";
                } else resetBall();
            }
        }

        function draw() {
            drawRect(0, 0, canvas.width, canvas.height, '#000');
            
            if (gameState === 'START') {
                drawText("ARCADE PONG", canvas.width / 2 - 230, canvas.height / 2 - 40, "70px 'Courier New'");
                
                // Pulsing prompt
                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    drawText("CLICK HERE TO START", canvas.width / 2 - 160, canvas.height / 2 + 30, "25px 'Courier New'");
                }
                return; 
            }

            drawNet();
            drawText(user.score, canvas.width / 4, canvas.height / 5);
            drawText(com.score, 3 * canvas.width / 4, canvas.height / 5);
            drawRect(user.x, user.y, user.width, user.height, user.color);
            drawRect(com.x, com.y, com.width, com.height, com.color);
            drawBall(ball.x, ball.y, ball.radius, ball.color);

            if (gameState === 'GAMEOVER') {
                context.fillStyle = "rgba(0, 0, 0, 0.8)";
                context.fillRect(0, 0, canvas.width, canvas.height);
                drawText(winnerText, canvas.width / 2 - 150, canvas.height / 2, "60px 'Courier New'");
                drawText("CLICK TO RESTART", canvas.width / 2 - 120, canvas.height / 2 + 50, "25px 'Courier New'");
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
