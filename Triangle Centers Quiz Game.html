<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Triangle Centers Quiz Game</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --success: #2ecc71;
            --error: #e74c3c;
            --background: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .game-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: #718096;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background: #edf2f7;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .scoreboard span {
            color: var(--primary-dark);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background: #f8fafc;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-option:active {
            transform: scale(0.98);
        }

        .btn-option.correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724 !important;
        }

        .btn-option.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--error) !important;
            color: #721c24 !important;
        }

        .btn-option:disabled {
            cursor: default;
        }

        .explanation-card {
            display: none;
            background: #ebf8ff;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .explanation-card h4 {
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .timestamp {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #4a5568;
            font-weight: 600;
        }

        .btn-next {
            display: none;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s ease;
        }

        .btn-next:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>Geometry Centers Quiz</h1>
        <p>Based on Organic Chemistry Tutor Video</p>
    </div>

    <div class="scoreboard">
        <div>Score: <span id="score">0</span></div>
        <div>Streak: <span id="streak">0</span> 🔥</div>
        <div>Best: <span id="high-score">0</span></div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>

    <div class="question-card" id="question">
        Loading Question...
    </div>

    <div class="options-grid" id="options">
        <!-- Dynamic Options -->
    </div>

    <div class="explanation-card" id="explanation">
        <h4>Step-by-Step Explanation:</h4>
        <p id="explanation-text"></p>
        <div class="timestamp" id="timestamp-text"></div>
    </div>

    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next Question ➔</button>
</div>

<script>
const questions = [
    // Incenter Questions
    { q: "What lines intersect to form the incenter of a triangle?", a: ["Angle Bisectors", "Medians", "Altitudes", "Perpendicular Bisectors"], c: 0, e: "The incenter is formed by the intersection of the three angle bisectors.", t: "[00:00:36]" },
    { q: "The incenter is the center of which circle?", a: ["Inscribed circle (Incircle)", "Circumscribed circle", "Unit circle", "Nine-point circle"], c: 0, e: "The incenter is always the center of the inscribed circle (incircle).", t: "[00:01:26]" },
    { q: "Where is the incenter located in an obtuse triangle?", a: ["Always Inside", "Outside", "On the hypotenuse", "At the right angle"], c: 0, e: "The incenter always lies INSIDE the triangle regardless of the triangle type.", t: "[00:00:27]" },
    { q: "If a circle fits perfectly inside a triangle touching all 3 sides, its center is the:", a: ["Incenter", "Circumcenter", "Centroid", "Orthocenter"], c: 0, e: "The incenter is the center of an inscribed circle.", t: "[00:01:26]" },
    { q: "An angle bisector divides an angle into:", a: ["Two equal angles", "Two perpendicular lines", "A 2:1 ratio", "A right angle"], c: 0, e: "An angle bisector cuts an interior angle into two congruent angles.", t: "[00:01:05]" },

    // Centroid Questions
    { q: "What lines intersect to form the centroid of a triangle?", a: ["Medians", "Altitudes", "Angle Bisectors", "Perpendicular Bisectors"], c: 0, e: "The centroid is the point of intersection of the three medians.", t: "[00:01:50]" },
    { q: "A median connects a vertex of a triangle to:", a: ["The midpoint of the opposite side", "The opposite angle bisector", "A 90-degree corner", "The circumcenter"], c: 0, e: "A median is a segment drawn from a vertex to the midpoint of the opposite side.", t: "[00:01:59]" },
    { q: "The centroid divides each median into segments with what ratio?", a: ["2 : 1", "1 : 1", "3 : 1", "3 : 2"], c: 0, e: "The segment from the vertex to the centroid is twice as long as the segment from centroid to midpoint (2:1 ratio).", t: "[00:02:46]" },
    { q: "If a median has a total length of 15, how long is the segment from vertex to centroid?", a: ["10", "5", "7.5", "12"], c: 0, e: "The longer segment is 2/3 of the total length: 2/3 * 15 = 10.", t: "[00:03:17]" },
    { q: "If the short segment of a median (centroid to midpoint) is 5, how long is the longer segment?", a: ["10", "5", "15", "2.5"], c: 0, e: "The vertex segment is twice the length of the short segment: 5 * 2 = 10.", t: "[00:02:56]" },
    { q: "If the segment from vertex to centroid is 8, how long is the short segment from centroid to midpoint?", a: ["4", "8", "16", "2"], c: 0, e: "The short segment is half of the long segment: 8 / 2 = 4.", t: "[00:03:00]" },
    { q: "Where is the centroid located in an obtuse triangle?", a: ["Always Inside", "Outside", "On the longest side", "At the vertex"], c: 0, e: "Like the incenter, the centroid ALWAYS lies inside the triangle.", t: "[00:02:21]" },
    { q: "If point D is the midpoint of side AC, then line BD is a:", a: ["Median", "Altitude", "Angle Bisector", "Perpendicular Bisector"], c: 0, e: "A line connecting a vertex to a midpoint on the opposite side is a median.", t: "[00:03:40]" },
    { q: "If PE = 6 in median AE, what is the length of AP (vertex to centroid)?", a: ["12", "6", "18", "3"], c: 0, e: "AP is twice PE: 6 * 2 = 12.", t: "[00:03:08]" },
    { q: "If AP = 14 in median AE, what is total length AE?", a: ["21", "7", "28", "14"], c: 0, e: "PE = 14 / 2 = 7. Total length AE = AP + PE = 14 + 7 = 21.", t: "[00:03:17]" },

    // Orthocenter Questions
    { q: "What lines intersect to form the orthocenter?", a: ["Altitudes", "Medians", "Perpendicular Bisectors", "Angle Bisectors"], c: 0, e: "The orthocenter is the point where the three altitudes intersect.", t: "[00:05:00]" },
    { q: "An altitude of a triangle is a line segment that is:", a: ["Perpendicular to the opposite side", "Connecting midpoints", "Bisecting an angle", "Equal to half the base"], c: 0, e: "An altitude is drawn from a vertex perpendicular (90 degrees) to the opposite side.", t: "[00:05:09]" },
    { q: "Where is the orthocenter located in a RIGHT triangle?", a: ["At the vertex of the right angle", "Inside the triangle", "On the hypotenuse midpoint", "Outside"], c: 0, e: "The orthocenter of a right triangle is located directly on the right-angle vertex.", t: "[00:07:31]" },
    { q: "Where is the orthocenter located in an OBTUSE triangle?", a: ["Outside the triangle", "Inside the triangle", "On the longest side", "At the vertex"], c: 0, e: "For an obtuse triangle, the altitudes extend to meet OUTSIDE the triangle.", t: "[00:09:24]" },
    { q: "Where is the orthocenter located in an ACUTE triangle?", a: ["Inside the triangle", "Outside the triangle", "On a side", "At a vertex"], c: 0, e: "In an acute triangle, the orthocenter lies INSIDE the triangle.", t: "[00:05:54]" },
    { q: "Which triangle center can be situated at one of the triangle's vertices?", a: ["Orthocenter", "Centroid", "Incenter", "Circumcenter"], c: 0, e: "The orthocenter lies on the vertex of the 90-degree angle in a right triangle.", t: "[00:07:31]" },

    // Circumcenter Questions
    { q: "What lines intersect to form the circumcenter?", a: ["Perpendicular Bisectors", "Altitudes", "Medians", "Angle Bisectors"], c: 0, e: "The circumcenter is formed by the intersection of the three perpendicular bisectors.", t: "[00:10:35]" },
    { q: "The circumcenter is the center of which circle?", a: ["Circumscribed circle", "Inscribed circle", "Inner circle", "Tangential circle"], c: 0, e: "The circumcenter is the center of a circle circumscribed about (outside) the triangle.", t: "[00:12:41]" },
    { q: "Where is the circumcenter located in a RIGHT triangle?", a: ["At the midpoint of the hypotenuse", "At the right angle vertex", "Outside the triangle", "Inside"], c: 0, e: "The circumcenter of a right triangle is located at the midpoint of the hypotenuse.", t: "[00:14:01]" },
    { q: "Where is the circumcenter located in an OBTUSE triangle?", a: ["Outside the triangle", "Inside the triangle", "At a vertex", "On the shortest side"], c: 0, e: "The circumcenter of an obtuse triangle lies OUTSIDE the triangle.", t: "[00:15:48]" },
    { q: "Where is the circumcenter located in an ACUTE triangle?", a: ["Inside the triangle", "Outside the triangle", "On a side", "At the midpoint"], c: 0, e: "The circumcenter of an acute triangle lies INSIDE the triangle.", t: "[00:12:29]" },
    { q: "A perpendicular bisector combines properties of which two line types?", a: ["Altitude and Median", "Median and Angle Bisector", "Altitude and Bisector", "Radius and Diameter"], c: 0, e: "It acts like a median (passes through midpoint) and an altitude (meets at 90°).", t: "[00:11:31]" },
    { q: "Does a perpendicular bisector always pass through a vertex of the triangle?", a: ["No, not necessarily", "Yes, always", "Only in right triangles", "Only in obtuse triangles"], c: 0, e: "A perpendicular bisector passes through the midpoint at 90°, not necessarily the vertex.", t: "[00:11:40]" },

    // Comparative & Application Questions
    { q: "Which two centers ALWAYS lie inside the triangle regardless of shape?", a: ["Incenter & Centroid", "Orthocenter & Circumcenter", "Incenter & Orthocenter", "Centroid & Circumcenter"], c: 0, e: "Incenter and Centroid ALWAYS lie inside every triangle.", t: "[00:02:21]" },
    { q: "Which two centers can lie OUTSIDE an obtuse triangle?", a: ["Orthocenter & Circumcenter", "Incenter & Centroid", "Centroid & Orthocenter", "Incenter & Circumcenter"], c: 0, e: "Both Orthocenter and Circumcenter lie outside obtuse triangles.", t: "[00:09:24]" },
    { q: "Which center is the center of mass or balancing point of a triangle?", a: ["Centroid", "Incenter", "Orthocenter", "Circumcenter"], c: 0, e: "The centroid represents the center of mass (geometric center) of a triangle.", t: "[00:01:39]" },
    { q: "If all 3 vertices of a triangle lie on a circle, that circle is:", a: ["Circumscribed", "Inscribed", "Centered", "Intersected"], c: 0, e: "A circle passing through all 3 vertices is circumscribed around the triangle.", t: "[00:12:41]" },
    { q: "The word 'Incenter' is associated with an ______ circle.", a: ["Inscribed", "Circumscribed", "Outer", "Extended"], c: 0, e: "Incenter = Inscribed circle.", t: "[00:01:26]" },
    { q: "The word 'Circumcenter' is associated with a ______ circle.", a: ["Circumscribed", "Inscribed", "Interior", "Tangent"], c: 0, e: "Circumcenter = Circumscribed circle.", t: "[00:12:41]" },
    { q: "If line segment AF = FB, point F must be a:", a: ["Midpoint", "Vertex", "Altitude", "Angle bisector"], c: 0, e: "If AF = FB, point F divides segment AB into two equal parts, so it is a midpoint.", t: "[00:04:12]" },
    { q: "Which center is formed by lines perpendicular to sides passing through midpoints?", a: ["Circumcenter", "Orthocenter", "Centroid", "Incenter"], c: 0, e: "Perpendicular bisectors create the circumcenter.", t: "[00:10:35]" },
    { q: "Which center is formed by lines perpendicular to sides passing through opposite vertices?", a: ["Orthocenter", "Centroid", "Incenter", "Circumcenter"], c: 0, e: "Altitudes pass through vertices perpendicular to opposite sides, forming the orthocenter.", t: "[00:05:00]" },
    { q: "In a right triangle, the circumcenter is on the midpoint of the:", a: ["Hypotenuse", "Shortest leg", "Right angle", "Altitude"], c: 0, e: "The circumcenter of a right triangle is at the midpoint of its hypotenuse.", t: "[00:14:01]" },
    { q: "In a right triangle, the orthocenter is located at the:", a: ["Vertex of the 90° angle", "Midpoint of hypotenuse", "Centroid point", "Outside area"], c: 0, e: "The orthocenter of a right triangle is at the right-angled vertex.", t: "[00:07:31]" },
    { q: "If a median is divided into 1/3 and 2/3 sections, the dividing point is the:", a: ["Centroid", "Incenter", "Orthocenter", "Circumcenter"], c: 0, e: "The centroid cuts medians into 1/3 and 2/3 ratios.", t: "[00:02:46]" },
    { q: "Lines that bisect angles and meet at a point form the:", a: ["Incenter", "Circumcenter", "Orthocenter", "Centroid"], c: 0, e: "Angle bisectors meet at the incenter.", t: "[00:00:36]" },
    { q: "Lines connecting vertices to midpoints are called:", a: ["Medians", "Altitudes", "Bisectors", "Hypotenuses"], c: 0, e: "Medians connect vertices to midpoints.", t: "[00:01:50]" },
    { q: "Lines meeting sides at 90-degree angles from vertices are called:", a: ["Altitudes", "Medians", "Angle Bisectors", "Radii"], c: 0, e: "Altitudes meet opposite sides at 90 degrees.", t: "[00:05:09]" },
    { q: "If PE = 3 in median AE, what is the length of AE?", a: ["9", "6", "12", "3"], c: 0, e: "Short = 3, Long = 6. Total AE = 3 + 6 = 9.", t: "[00:03:17]" },
    { q: "If AE = 24, what is the length of short segment PE?", a: ["8", "16", "12", "6"], c: 0, e: "Short segment is 1/3 of total: 24 / 3 = 8.", t: "[00:03:30]" },
    { q: "If AE = 18, what is the length of long segment AP?", a: ["12", "6", "9", "15"], c: 0, e: "Long segment is 2/3 of total: (2/3) * 18 = 12.", t: "[00:03:17]" },
    { q: "What type of triangle has an orthocenter outside its perimeter?", a: ["Obtuse", "Acute", "Right", "Equilateral"], c: 0, e: "Obtuse triangles have orthocenters located outside.", t: "[00:09:24]" },
    { q: "What type of triangle has a circumcenter outside its perimeter?", a: ["Obtuse", "Acute", "Right", "Isosceles"], c: 0, e: "Obtuse triangles have circumcenters located outside.", t: "[00:15:48]" },
    { q: "The point where angle bisectors meet is equidistant from the triangle's:", a: ["Three sides", "Three vertices", "Midpoints", "Altitudes"], c: 0, e: "The incenter is equidistant from all three sides of the triangle.", t: "[00:01:26]" },
    { q: "The circumcenter is equidistant from the triangle's:", a: ["Three vertices", "Three sides", "Midpoints", "Angles"], c: 0, e: "Since it is the center of the circumscribed circle, it is equidistant to all 3 vertices.", t: "[00:12:41]" },
    { q: "Which line segment is associated with the Centroid?", a: ["Median", "Altitude", "Angle Bisector", "Perpendicular Bisector"], c: 0, e: "Centroid = Medians.", t: "[00:16:47]" },
    { q: "Which line segment is associated with the Orthocenter?", a: ["Altitude", "Median", "Angle Bisector", "Perpendicular Bisector"], c: 0, e: "Orthocenter = Altitudes.", t: "[00:16:57]" },
    { q: "Which line segment is associated with the Incenter?", a: ["Angle Bisector", "Median", "Altitude", "Perpendicular Bisector"], c: 0, e: "Incenter = Angle Bisectors.", t: "[00:16:30]" },
    { q: "Which line segment is associated with the Circumcenter?", a: ["Perpendicular Bisector", "Median", "Altitude", "Angle Bisector"], c: 0, e: "Circumcenter = Perpendicular Bisectors.", t: "[00:17:06]" }
];

let currentIndex = 0;
let score = 0;
let streak = 0;
let highScore = 0;
let shuffledQuestions = [];

function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initGame() {
    shuffledQuestions = shuffle(questions);
    currentIndex = 0;
    score = 0;
    streak = 0;
    updateScoreboard();
    showQuestion();
}

function showQuestion() {
    // Infinite Loop: Reshuffle when reaching the end
    if (currentIndex >= shuffledQuestions.length) {
        shuffledQuestions = shuffle(questions);
        currentIndex = 0;
    }

    const q = shuffledQuestions[currentIndex];
    
    // Update progress bar based on total original question count
    const progressPercent = ((currentIndex % questions.length) / questions.length) * 100;
    document.getElementById('progress').style.width = `${progressPercent}%`;

    document.getElementById('question').innerText = `${(currentIndex % questions.length) + 1}. ${q.q}`;
    
    // Prepare options (shuffle choices keeping track of correct index)
    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    let choices = q.a.map((text, index) => ({ text, isCorrect: index === q.c }));
    choices = shuffle(choices);

    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = choice.text;
        btn.onclick = () => selectOption(btn, choice.isCorrect);
        optionsContainer.appendChild(btn);
    });

    document.getElementById('explanation').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
}

function selectOption(selectedBtn, isCorrect) {
    const buttons = document.querySelectorAll('.btn-option');
    buttons.forEach(btn => btn.disabled = true);

    const q = shuffledQuestions[currentIndex];

    if (isCorrect) {
        selectedBtn.classList.add('correct');
        score += 10 + (streak * 2);
        streak++;
        if (score > highScore) highScore = score;
    } else {
        selectedBtn.classList.add('incorrect');
        streak = 0;
        // Highlight correct answer
        buttons.forEach(btn => {
            if (btn.innerText === q.a[q.c]) {
                btn.classList.add('correct');
            }
        });
    }

    updateScoreboard();

    // Show Explanation
    document.getElementById('explanation-text').innerText = q.e;
    document.getElementById('timestamp-text').innerText = `Video Reference Timestamp: ${q.t}`;
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    showQuestion();
}

function updateScoreboard() {
    document.getElementById('score').innerText = score;
    document.getElementById('streak').innerText = streak;
    document.getElementById('high-score').innerText = highScore;
}

// Start game on load
window.onload = initGame;
</script>

</body>
</html>
