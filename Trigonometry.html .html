<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigonometry Master Challenge</title>
    <!-- MathJax for rendering crisp LaTeX mathematical symbols -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .title-area h1 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .title-area span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .score-board {
            text-align: right;
        }

        .score-val {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: rgba(15, 23, 42, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            transition: width 0.3s ease;
        }

        .question-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .question-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            font-weight: 600;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-option {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 10px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-option:active {
            transform: scale(0.97);
        }

        .btn-option.correct {
            background-color: var(--success) !important;
            border-color: var(--success) !important;
            color: #ffffff;
        }

        .btn-option.wrong {
            background-color: var(--danger) !important;
            border-color: var(--danger) !important;
            color: #ffffff;
        }

        .explanation-card {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.88rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-card.show {
            display: block;
        }

        .explanation-title {
            font-weight: bold;
            color: var(--success);
            margin-bottom: 4px;
        }

        .btn-next {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .btn-next.show {
            display: block;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .modal-body h2 {
            margin-bottom: 12px;
            color: var(--primary);
        }

        .modal-body p {
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .btn-restart {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <div class="title-area">
            <h1>Trig Quest</h1>
            <span>Identity & Symbol Values</span>
        </div>
        <div class="score-board">
            <div id="score" class="score-val">0</div>
            <div style="font-size: 0.7rem; color: var(--text-muted);">POINTS</div>
        </div>
    </header>

    <div class="stats-bar">
        <div>Question: <strong id="q-num">1</strong>/50</div>
        <div>Streak: <strong id="streak" style="color: var(--success);">0</strong></div>
        <div>Best: <strong id="high-score">0</strong></div>
    </div>

    <div class="progress-bar-container">
        <div id="progress" class="progress-bar"></div>
    </div>

    <div class="question-card">
        <div id="q-tag" class="question-tag">Category</div>
        <div id="q-text" class="question-text">Loading question...</div>
    </div>

    <div id="options" class="options-grid"></div>

    <div id="explanation" class="explanation-card">
        <div class="explanation-title">Step-by-Step Breakdown</div>
        <div id="exp-text"></div>
    </div>

    <button id="btn-next" class="btn-next" onclick="nextQuestion()">Next Question →</button>
</div>

<div id="result-modal" class="modal-overlay">
    <div class="modal-body">
        <h2>Run Complete!</h2>
        <p id="final-stats">You finished 50 questions.</p>
        <button class="btn-restart" onclick="restartGame()">Continue (Infinite Mode)</button>
    </div>
</div>

<script>
    const STANDARD_VALUES = {
        'sin': { 30: '\\frac{1}{2}', 45: '\\frac{\\sqrt{2}}{2}', 60: '\\frac{\\sqrt{3}}{2}' },
        'cos': { 30: '\\frac{\\sqrt{3}}{2}', 45: '\\frac{\\sqrt{2}}{2}', 60: '\\frac{1}{2}' },
        'tan': { 30: '\\frac{\\sqrt{3}}{3}', 45: '1', 60: '\\sqrt{3}' }
    };

    let currentQuestion = 0;
    let score = 0;
    let streak = 0;
    let highScore = localStorage.getItem('trig_high_score') || 0;
    let isAnswered = false;
    let activeQuestionObj = null;

    document.getElementById('high-score').innerText = highScore;

    function generateQuestion() {
        const types = ['values', 'pythagorean', 'quotient', 'complementary_sin70', 'complementary_cos', 'complementary_tan'];
        const chosenType = types[Math.floor(Math.random() * types.length)];
        
        let qText = '';
        let tag = '';
        let correctOpt = '';
        let wrongOpts = [];
        let stepExp = '';

        if (chosenType === 'values') {
            tag = 'Exact Values';
            const fn = ['sin', 'cos', 'tan'][Math.floor(Math.random() * 3)];
            const angle = [30, 45, 60][Math.floor(Math.random() * 3)];
            qText = `\\(${fn}(${angle}^\\circ)\\)`;
            correctOpt = `\\(${STANDARD_VALUES[fn][angle]}\\)`;

            const allVals = ['\\frac{1}{2}', '\\frac{\\sqrt{2}}{2}', '\\frac{\\sqrt{3}}{2}', '\\frac{\\sqrt{3}}{3}', '1', '\\sqrt{3}', '0'];
            wrongOpts = allVals
                .filter(v => v !== STANDARD_VALUES[fn][angle])
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(v => `\\(${v}\\)`);

            stepExp = `1. Recall the standard special right triangles for $${angle}^\\circ$.<br>2. \\(${fn}(${angle}^\\circ) = ${STANDARD_VALUES[fn][angle]}\\).`;
        } 
        else if (chosenType === 'pythagorean') {
            tag = 'Pythagorean Identity';
            const theta = [15, 25, 37, 54, 70, 72][Math.floor(Math.random() * 6)];
            qText = `\\(\\sin^2(${theta}^\\circ) + \\cos^2(${theta}^\\circ)\\)`;
            correctOpt = '\\(1\\)';
            wrongOpts = ['\\(0\\)', '\\(2\\)', `\\(\\tan(${theta}^\\circ)\\)`];

            stepExp = `1. Use fundamental identity: \\(\\sin^2(\\theta) + \\cos^2(\\theta) = 1\\).<br>2. Since $\\theta = ${theta}^\\circ$ for both, the total is always **1**.`;
        } 
        else if (chosenType === 'quotient') {
            tag = 'Quotient Identity';
            const theta = [20, 35, 50, 65, 70][Math.floor(Math.random() * 5)];
            qText = `\\(\\frac{\\sin(${theta}^\\circ)}{\\cos(${theta}^\\circ)}\\)`;
            correctOpt = `\\(\\tan(${theta}^\\circ)\\)`;
            wrongOpts = [`\\(\\frac{1}{\\tan(${theta}^\\circ)}\\)`, '\\(1\\)', `\\(\\sin(${theta}^\\circ)\\)`];

            stepExp = `1. Use quotient identity: \\(\\frac{\\sin(\\theta)}{\\cos(\\theta)} = \\tan(\\theta)\\).<br>2. For $\\theta = ${theta}^\\circ$, the result is **\\(\\tan(${theta}^\\circ)\\)**.`;
        } 
        else if (chosenType === 'complementary_sin70') {
            tag = 'Co-Function Identity';
            const theta = [70, 80, 65, 50, 40][Math.floor(Math.random() * 5)];
            const comp = 90 - theta;
            qText = `\\(\\sin(${theta}^\\circ)\\)`;
            correctOpt = `\\(\\cos(${comp}^\\circ)\\)`;
            wrongOpts = [`\\(\\cos(${theta}^\\circ)\\)`, `\\(\\sin(${comp}^\\circ)\\)`, `\\(\\tan(${comp}^\\circ)\\)`];

            stepExp = `1. Use co-function identity: \\(\\sin(\\theta) = \\cos(90^\\circ - \\theta)\\).<br>2. Substitute $\\theta = ${theta}^\\circ$:<br>\\(\\sin(${theta}^\\circ) = \\cos(90^\\circ - ${theta}^\\circ) = \\mathbf{\\cos(${comp}^\\circ)}\\).`;
        }
        else if (chosenType === 'complementary_cos') {
            tag = 'Co-Function Identity';
            const theta = [20, 30, 40, 60, 70][Math.floor(Math.random() * 5)];
            const comp = 90 - theta;
            qText = `\\(\\cos(${theta}^\\circ)\\)`;
            correctOpt = `\\(\\sin(${comp}^\\circ)\\)`;
            wrongOpts = [`\\(\\sin(${theta}^\\circ)\\)`, `\\(\\cos(${comp}^\\circ)\\)`, '\\(1\\)'];

            stepExp = `1. Use identity: \\(\\cos(\\theta) = \\sin(90^\\circ - \\theta)\\).<br>2. Compute $90^\\circ - ${theta}^\\circ = ${comp}^\\circ$.<br>3. Result: **\\(\\sin(${comp}^\\circ)\\)**.`;
        }
        else if (chosenType === 'complementary_tan') {
            tag = 'Reciprocal/Complement';
            const theta = [10, 20, 30, 40, 70][Math.floor(Math.random() * 5)];
            const comp = 90 - theta;
            qText = `\\(\\tan(${theta}^\\circ)\\)`;
            correctOpt = `\\(\\frac{1}{\\tan(${comp}^\\circ)}\\)`;
            wrongOpts = [`\\(\\tan(${comp}^\\circ)\\)`, `\\(\\frac{1}{\\tan(${theta}^\\circ)}\\)`, `\\(\\cos(${comp}^\\circ)\\)`];

            stepExp = `1. Apply identity: \\(\\tan(\\theta) = \\frac{1}{\\tan(90^\\circ - \\theta)}\\).<br>2. Calculate $90^\\circ - ${theta}^\\circ = ${comp}^\\circ$.<br>3. Result: **\\(\\frac{1}{\\tan(${comp}^\\circ)}\\)**.`;
        }

        const options = [...wrongOpts, correctOpt].sort(() => 0.5 - Math.random());

        return {
            tag: tag,
            question: qText,
            options: options,
            correct: correctOpt,
            explanation: stepExp
        };
    }

    function renderQuestion() {
        isAnswered = false;
        activeQuestionObj = generateQuestion();

        document.getElementById('q-tag').innerText = activeQuestionObj.tag;
        document.getElementById('q-text').innerHTML = activeQuestionObj.question;
        
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        activeQuestionObj.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('explanation').classList.remove('show');
        document.getElementById('btn-next').classList.remove('show');

        currentQuestion++;
        document.getElementById('q-num').innerText = currentQuestion;
        
        let progressPct = ((currentQuestion - 1) % 50) / 50 * 100;
        document.getElementById('progress').style.width = `${progressPct}%`;

        // Re-render LaTeX symbols dynamically using MathJax
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function checkAnswer(selectedBtn, selectedVal) {
        if (isAnswered) return;
        isAnswered = true;

        const allButtons = document.querySelectorAll('.btn-option');

        if (selectedVal === activeQuestionObj.correct) {
            selectedBtn.classList.add('correct');
            score += 10 + (streak * 2);
            streak++;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('trig_high_score', highScore);
                document.getElementById('high-score').innerText = highScore;
            }
        } else {
            selectedBtn.classList.add('wrong');
            streak = 0;
            allButtons.forEach(btn => {
                if (btn.innerHTML === activeQuestionObj.correct) {
                    btn.classList.add('correct');
                }
            });
        }

        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;

        document.getElementById('exp-text').innerHTML = activeQuestionObj.explanation;
        document.getElementById('explanation').classList.add('show');
        document.getElementById('btn-next').classList.add('show');

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function nextQuestion() {
        if (currentQuestion % 50 === 0) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    function showResults() {
        document.getElementById('final-stats').innerHTML = 
            `You completed a 50-question run!<br><br>Final Score: <strong>${score}</strong><br>High Score: <strong>${highScore}</strong>`;
        document.getElementById('result-modal').classList.add('active');
    }

    function restartGame() {
        document.getElementById('result-modal').classList.remove('active');
        renderQuestion();
    }

    renderQuestion();
</script>
</body>
</html>
